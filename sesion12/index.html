<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión 12: Integración Numérica | UPeU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <a href="../index.html" class="text-xs text-blue-400 hover:underline">← Volver al Panel de Unidad 3</a>
                <h1 class="text-xl font-bold text-white mt-1">Unidad 3 - Sesión 12: Regla de los Trapecios</h1>
            </div>
            <span class="text-xs bg-blue-900/50 text-blue-300 px-3 py-1 rounded-full border border-blue-700">
                Integración Numérica
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Panel Inputs -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg lg:col-span-1 flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-semibold mb-4 text-blue-400 border-b border-slate-700 pb-2">Parámetros</h2>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Método</label>
                    <select id="metodo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                        <option value="compuesto">Regla del Trapecio Compuesta</option>
                        <option value="simple">Regla del Trapecio Simple (n=1)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Función f(t)</label>
                    <input type="text" id="funcionInput" value="10 + 5*Math.sin((Math.PI * t) / 4) + Math.exp(0.15 * t)" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-emerald-400 font-mono">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Límite (a)</label>
                        <input type="number" id="limA" value="0" step="any" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Límite (b)</label>
                        <input type="number" id="limB" value="12" step="any" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Subintervalos (n)</label>
                    <input type="number" id="numN" value="4" min="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                </div>
            </div>

            <button onclick="ejecutarCalculo()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                Calcular Integral y Malla
            </button>
        </section>

        <!-- Panel Resultados -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg lg:col-span-2 flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-semibold mb-4 text-emerald-400 border-b border-slate-700 pb-2">Resultados</h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                        <span class="text-xs text-slate-400 block">Ancho de Paso (h)</span>
                        <span id="resH" class="text-2xl font-bold text-blue-400">3.0000</span>
                    </div>
                    <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                        <span class="text-xs text-slate-400 block">Valor Aproximado (I)</span>
                        <span id="resIntegral" class="text-2xl font-bold text-emerald-400">160.4439</span>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-2">Malla de Puntos (t<sub>i</sub>, f(t<sub>i</sub>))</h3>
                    <div class="overflow-x-auto max-h-48 border border-slate-700 rounded-lg">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-900 text-slate-400 uppercase text-xs sticky top-0">
                                <tr>
                                    <th class="py-2 px-4">i</th>
                                    <th class="py-2 px-4">t<sub>i</sub></th>
                                    <th class="py-2 px-4">f(t<sub>i</sub>)</th>
                                </tr>
                            </thead>
                            <tbody id="tablaMallaBody" class="divide-y divide-slate-700"></tbody>
                        </table>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-semibold text-slate-300 mb-2">Análisis de Convergencia (GAA)</h3>
                    <div class="overflow-x-auto border border-slate-700 rounded-lg">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                                <tr>
                                    <th class="py-2 px-3">n</th>
                                    <th class="py-2 px-3">h</th>
                                    <th class="py-2 px-3">Valor Integral</th>
                                </tr>
                            </thead>
                            <tbody id="tablaConvergenciaBody" class="divide-y divide-slate-700"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
